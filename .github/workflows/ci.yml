name: CI Queue checks

# Sem crédito, qualquer job que peça runs-on falha vermelho ANTES dos steps.
# Remoto OFF por padrão (variable CI_QUEUE_REMOTE_CI != true): todos os jobs
# ficam skipped → a check suite não fica vermelha.
# Liga Actions: Settings → Secrets and variables → Actions → Variables →
#   CI_QUEUE_REMOTE_CI = true
# Prova local (sem minutos): npm run ci:attest-check → status local/check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  statuses: read

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify changed paths
    if: ${{ vars.CI_QUEUE_REMOTE_CI == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changed-paths.outputs.docs_only }}
      local_proof_valid: ${{ steps.local-proof.outputs.local_proof_valid }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changed-paths
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$PR_BASE_REF"
          else
            base="$EVENT_BEFORE"
          fi

          if [ -z "$base" ] || printf '%s' "$base" | grep -q '^0\{40\}$'; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi

          docs_only="$(printf '%s\n' "$changed" | bash scripts/ci/classify-docs-only.sh)"
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

      - name: Read local/check proof
        id: local-proof
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            echo "local_proof_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          proof_hits=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | select(.context == "local/check" and .state == "success" and .description == "base:'"$BASE_SHA"'")] | length')
          if [ "$proof_hits" -gt 0 ]; then
            echo "local_proof_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "local_proof_valid=false" >> "$GITHUB_OUTPUT"
          fi

  documentation:
    name: Documentation check
    needs: scope
    if: ${{ vars.CI_QUEUE_REMOTE_CI == 'true' && needs.scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$PR_BASE_REF...$GITHUB_SHA"
          elif [ -n "$EVENT_BEFORE" ] && ! printf '%s' "$EVENT_BEFORE" | grep -q '^0\{40\}$'; then
            git diff --check "$EVENT_BEFORE" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

  local-proof:
    name: Local check proof accepted
    needs: scope
    if: >-
      vars.CI_QUEUE_REMOTE_CI == 'true' &&
      github.event_name == 'pull_request' &&
      needs.scope.outputs.docs_only != 'true' &&
      needs.scope.outputs.local_proof_valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Accept local/check attestation
        run: |
          echo "Skipping remote Complete check: local/check success with base:${{ github.event.pull_request.base.sha }}"

  check:
    name: Complete check
    needs: scope
    if: >-
      vars.CI_QUEUE_REMOTE_CI == 'true' &&
      needs.scope.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' || needs.scope.outputs.local_proof_valid != 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete product check
        run: npm run check
