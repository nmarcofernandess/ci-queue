name: CI Queue checks

# Mesmo pacote DietFlow:
# 1) CI local (fila) + attestation `local/check` (description=base:<sha>)
# 2) Git CI ~1 min no ready: um único job classifica e, com prova local, dispensa
#    o Complete check (billing arredonda por job — um job = ~1 min no caminho feliz)
# 3) Draft: job skipped (0 min). Sem crédito no ready: falha de plataforma; merge
#    com prova local sem esperar Actions (equivalente a --no-remote).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read
  pull-requests: read

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-verdict:
    name: ci-verdict
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify (docs-only + prova local)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$PR_BASE_REF"
          else
            base="${EVENT_BEFORE:-}"
          fi

          if [ -z "$base" ] || printf '%s' "$base" | grep -q '^0\{40\}$'; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi

          docs_only="$(printf '%s\n' "$changed" | bash scripts/ci/classify-docs-only.sh)"
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA}" ]; then
            echo "local_proof_valid=false" >> "$GITHUB_OUTPUT"
          else
            proof_hits=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "local/check" and .state == "success" and .description == "base:'"$BASE_SHA"'")] | length')
            if [ "$proof_hits" -gt 0 ]; then
              echo "local_proof_valid=true" >> "$GITHUB_OUTPUT"
            else
              echo "local_proof_valid=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Documentation whitespace
        if: steps.classify.outputs.docs_only == 'true'
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$PR_BASE_REF...$GITHUB_SHA"
          elif [ -n "${EVENT_BEFORE:-}" ] && ! printf '%s' "$EVENT_BEFORE" | grep -q '^0\{40\}$'; then
            git diff --check "$EVENT_BEFORE" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Set up Node.js
        if: steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.local_proof_valid != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        if: steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.local_proof_valid != 'true'
        run: |
          npm ci
          npm --prefix ui ci

      - name: Install Playwright Chromium
        if: steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.local_proof_valid != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run complete product check
        if: steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.local_proof_valid != 'true'
        run: npm run check

      - name: Verdict summary
        if: always()
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          PROOF_VALID: ${{ steps.classify.outputs.local_proof_valid }}
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY_OUTCOME" != "success" ]; then
            line="classificação falhou — veredito fail-closed"
          elif [ "${DOCS_ONLY:-}" = "true" ]; then
            line="docs-only"
          elif [ "${PROOF_VALID:-}" = "true" ]; then
            line="Complete check dispensado por local/check em HEAD+base (base:${BASE_SHA})"
          else
            line="fallback remoto: Complete check executado"
          fi
          echo "$line"
          echo "**ci-verdict:** $line" >> "$GITHUB_STEP_SUMMARY"
