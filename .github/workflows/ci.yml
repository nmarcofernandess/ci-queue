name: CI Queue checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Complete check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete product check
        run: npm run check
