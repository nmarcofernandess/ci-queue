pattern: ui-composition
version: 1
status: active
updated: 2026-09-21
foundation:
  registry: radix-nova
  primitives: ui/src/components/ui
  behavior: docs/ui/PRODUCT-CONTRACT.md
  visual_language: DESIGN.md
  official_compositions: docs/ui/COMPOSITION-LEDGER.md
read_when:
  - "Criar ou alterar identidade, drawer, tabela, árvore, ação ou estado visual."
  - "Modificar um primitivo consumido por mais de uma superfície."
composition:
  identity:
    source: ui/src/features/shared/entity-identity.tsx
    variants_source: ui/src/features/shared/presentation.ts
    use: "Mesma identidade com apresentações current/drawer/table; passar conteúdo, não estilo."
  execution_state:
    descriptor: ui/src/features/shared/presentation.ts
    indicator: ui/src/features/shared/status-indicator.tsx
    color: ui/src/features/shared/status-color.ts
    use: "Um ícone por estado. Rodando neutro; retry amarelo; falha no progresso vermelho. No terminal, cor do resultado e Flaky detectado no tooltip/nome acessível."
    consumers:
      - ui/src/features/status/status-page.tsx
      - ui/src/features/shared/run-table.tsx
      - ui/src/features/shared/job-drawer.tsx
      - ui/src/features/shared/progress-tree.tsx
      - ui/src/features/shared/execution-stages.tsx
    checks:
      - tests/ui/presentation.test.ts
      - tests/browser/dashboard.spec.ts
      - tests/browser/table-layout.spec.ts
  inspect:
    source: ui/src/features/shared/inspect-button.tsx
    use: "Olho compartilhado; label Inspecionar; tamanho em presentation.inspect; sem data-icon."
    consumers:
      - ui/src/features/shared/live-time.tsx
      - ui/src/features/shared/run-table.tsx
      - ui/src/features/status/green-commit-table.tsx
      - ui/src/features/worktrees/worktrees-page.tsx
  elapsed:
    source: ui/src/features/shared/live-time.tsx
    use: "ElapsedItem no fim do CardContent da execução atual; JobTimeline permanece no drawer."
    consumers:
      - ui/src/features/status/status-page.tsx
      - ui/src/features/shared/job-drawer.tsx
  project_chip:
    source: ui/src/features/shared/project-chip.tsx
    model: ui/src/features/shared/project-chip-model.ts
    use: "Badge outline + Tooltip com nome completo; mode literal obrigatório; className local proibida."
    modes:
      inline:
        use: "Identidade em execução atual, tabelas e drawers; preserva apresentação existente."
        consumers:
          - ui/src/features/status/status-page.tsx
          - ui/src/features/shared/run-table.tsx
          - ui/src/features/shared/job-drawer.tsx
          - ui/src/features/worktrees/worktrees-page.tsx
          - ui/src/features/status/green-commit-table.tsx
          - ui/src/features/status/status-state-drawer.tsx
      compact-context:
        use: "Somente previews laterais de Metas/Pendências em Todos; linha própria acima do título, texto truncável, sem overflow ou redução de fonte."
        consumers:
          - ui/src/features/status/status-state-cards.tsx
    checks:
      - tests/ui/ui-policy.test.ts
      - tests/browser/dashboard.spec.ts
      - tests/browser/ui-consistency.spec.ts
  project_selection_panel:
    source: ui/src/features/projects/project-selection-panel.tsx
    use: "Lista pesquisável compartilhada de projetos ativos via SelectionPanel. ProjectSwitcher muda ReadScope; drawers mudam apenas ProjectTarget local."
    consumers:
      - ui/src/features/projects/project-switcher.tsx
      - ui/src/features/status/status-state-drawer.tsx
    checks:
      - tests/browser/dashboard.spec.ts
  drawer:
    source: ui/src/features/shared/detail-drawer.tsx
    consumers:
      - ui/src/features/shared/job-drawer.tsx
      - ui/src/features/worktrees/worktrees-page.tsx
      - ui/src/features/status/status-state-drawer.tsx
      - ui/src/features/status/green-commit-table.tsx
      - ui/src/features/projects/project-manager-drawer.tsx
  progress_duration:
    source: ui/src/features/shared/progress-duration.tsx
    model: ui/src/features/shared/progress-duration-model.ts
    use: "Árvore e faixa compartilham o mesmo conteúdo de duração/origem/ausência."
    consumers:
      - ui/src/features/shared/progress-tree.tsx
      - ui/src/features/shared/execution-stages.tsx
  filters:
    source: ui/src/features/shared/filter-select.tsx
    consumers:
      - ui/src/features/status/status-page.tsx
      - ui/src/features/analysis/analysis-page.tsx
  selection_panel:
    source: ui/src/features/shared/selection-panel.tsx
    consumers:
      - ui/src/features/projects/project-switcher.tsx
      - ui/src/features/analysis/preset-multi-select.tsx
  project_scope:
    source: ui/src/features/projects/project-context.tsx
    use: "Uma aba, um ReadScope (project | all | unassigned). Occupancy global relê o mesmo fato; detalhe é por jobId."
    consumers:
      - ui/src/features/status/status-page.tsx
      - ui/src/features/worktrees/worktrees-page.tsx
      - ui/src/features/analysis/analysis-page.tsx
      - ui/src/features/shared/job-drawer.tsx
  local_environment:
    source: ui/src/components/local-environment-menu.tsx
    use: "Único dono de Bridge e tema no rodapé."
  facts:
    source: ui/src/features/shared/facts-table.tsx
    use: "Ficha de metadados de detalhe, sem card adicional."
  table:
    source: ui/src/features/shared/data-table-frame.tsx
    use: "Tabela de lista com placement card/body e scroll local; consumidor define largura de identidade com limite para expor colunas seguintes. Não mudar modelo de dados."
  progress:
    tree: ui/src/features/shared/progress-tree.tsx
    strip: ui/src/features/shared/execution-stages.tsx
    indicator: ui/src/features/shared/status-indicator.tsx
  states:
    source: ui/src/features/shared/async-state.tsx
change_protocol:
  - "Localizar os consumidores do proprietário antes de editar."
  - "Alterar a composição compartilhada e migrar todos os consumidores afetados."
  - "Não corrigir a estrutura só no local mostrado no print."
  - "Verificar a família inteira no browser, incluindo estados e largura intermediária."
enforcement:
  lint: ui/eslint.config.js
  semantics: tests/ui/presentation.test.ts
  browser: tests/browser/ui-consistency.spec.ts
