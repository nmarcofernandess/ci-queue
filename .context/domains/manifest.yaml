version: 1
project: ci-queue
read_first:
  - AGENTS.md
  - DESIGN.md
  - docs/ui/PRODUCT-CONTRACT.md
patterns:
  ui: .context/patterns/ui-composition.yaml
system_map:
  status:
    route: "#status"
    entry: ui/src/features/status/status-page.tsx
    patterns: [ui]
    related:
      - ui/src/features/shared/run-table.tsx
      - ui/src/features/shared/job-drawer.tsx
      - ui/src/features/shared/presentation.ts
      - ui/src/features/shared/status-indicator.tsx
      - ui/src/features/status/status-state-drawer.tsx
      - ui/src/features/status/green-commit-table.tsx
  worktrees:
    route: "#worktrees"
    entry: ui/src/features/worktrees/worktrees-page.tsx
    patterns: [ui]
    related:
      - ui/src/features/shared/detail-drawer.tsx
      - ui/src/features/shared/facts-table.tsx
      - ui/src/features/shared/data-table-frame.tsx
  analysis:
    route: "#analysis"
    entry: ui/src/features/analysis/analysis-page.tsx
    patterns: [ui]
    related:
      - ui/src/features/analysis/results-model.ts
      - ui/src/features/analysis/analysis-state.ts
      - ui/src/features/analysis/preset-multi-select.tsx
      - ui/src/components/ui/chart.tsx
      - ui/src/features/shared/data-table-frame.tsx
      - ui/src/features/shared/filter-select.tsx
  projects:
    entry: ui/src/features/projects/project-context.tsx
    related:
      - ui/src/features/projects/scope.ts
      - ui/src/features/projects/project-switcher.tsx
      - ui/src/features/projects/project-manager-drawer.tsx
      - backend/ci_queue_api/projects.py
      - backend/ci_queue_api/project_context.py
    rule: "Trocar o contexto de projeto exige reler todos os consumidores scoped."
  shell:
    entry: ui/src/App.tsx
    related:
      - ui/src/components/app-sidebar.tsx
      - ui/src/components/site-header.tsx
      - ui/src/components/local-environment-menu.tsx
  data_boundary:
    entry: ui/src/lib/api.ts
    types: ui/src/lib/types.ts
    rule: "Features consomem os fatos atuais via APIs scoped; composições visuais não fazem fetch."
  execution_state:
    entry: ui/src/features/shared/presentation.ts
    indicator: ui/src/features/shared/status-indicator.tsx
    color: ui/src/features/shared/status-color.ts
    consumers:
      - ui/src/features/status/status-page.tsx
      - ui/src/features/shared/run-table.tsx
      - ui/src/features/shared/job-drawer.tsx
      - ui/src/features/shared/progress-tree.tsx
      - ui/src/features/shared/execution-stages.tsx
    checks:
      - tests/ui/presentation.test.ts
      - tests/browser/table-layout.spec.ts
      - tests/browser/dashboard.spec.ts
    rule: "Rodando neutro; retry amarelo; falha em progresso vermelho; terminal conserva a cor do resultado e anuncia Flaky detectado no indicador."
  integration_documentation:
    entry: docs/CONSUMER-QUICKSTART.md
    tutorial: docs/GUIA-INTEGRACAO-CI-QUEUE.html
    contracts: docs/CONTRACTS.md
    installation: docs/INSTALL.md
    node_binding: docs/RUNTIME-ISOLATION.md
    index: docs/README.md
    rule: "Manual offline não é proof de runtime. Adoção atualiza AGENTS e skill/instrução do consumidor; não duplica contratos."
